name: Temporary Firefox lab runner

on:
  push:
    branches:
      - firefox-lab-public-runner-20260910

permissions:
  contents: read

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned Mozilla ASan jsshell and jit-tests
        env:
          TASK_ID: B6b9aNHFQluJIk-yVGxJwA
        run: |
          set -euo pipefail
          base="https://firefox-ci-tc.services.mozilla.com/api/queue/v1/task/${TASK_ID}/artifacts/public/build"
          curl --retry 5 --retry-all-errors --fail --silent --show-error --location "$base/target.jsshell.zip" -o target.jsshell.zip
          curl --retry 5 --retry-all-errors --fail --silent --show-error --location "$base/target.jittest.tests.tar.zst" -o target.jittest.tests.tar.zst
          unzip -q target.jsshell.zip -d shell
          mkdir tests
          tar --zstd -xf target.jittest.tests.tar.zst -C tests
          JS_BIN="$(find shell -type f -name js -perm -111 | head -1)"
          test -n "$JS_BIN"
          echo "JS_BIN=$JS_BIN" >> "$GITHUB_ENV"
          echo "BIN_DIR=$(dirname "$JS_BIN")" >> "$GITHUB_ENV"
          echo "ASAN_SYMBOLIZER_PATH=$(find shell -type f -name llvm-symbolizer -perm -111 | head -1 || true)" >> "$GITHUB_ENV"
          sha256sum "$JS_BIN"

      - name: Inventory harness and high-risk suites
        run: |
          set -euo pipefail
          printf '%s\n' '=== archive roots ==='
          find tests -maxdepth 3 -type d | sort | head -160
          printf '%s\n' '=== harnesses ==='
          find tests -type f \( -name 'jit_test.py' -o -name 'jittests.py' -o -name 'shell.js' \) | sort | head -160
          printf '%s\n' '=== candidate tests ==='
          find tests -type f | grep -Ei '/jit-test/tests/(wasm/(gc|stack-switch|continu|memory|table)|basic/.*(resizable|growable)|ion/.*(arraybuffer|typedarray|dataview))' | sort | head -600

      - name: Verify shell flags
        env:
          ASAN_OPTIONS: detect_leaks=0:symbolize=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$BIN_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$JS_BIN" --help 2>&1 | grep -Ei -- '--wasm|baseline|ion|fuzzing-safe|gc-zeal' | head -160 || true
