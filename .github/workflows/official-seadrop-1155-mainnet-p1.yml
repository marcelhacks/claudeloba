name: Official SeaDrop ERC1155 Ethereum independent proof

on:
  push:
    branches: [research/seadrop-p1-lab-20260911]
    paths:
      - research/OfficialSeaDrop1155PricedP1.t.sol
      - .github/workflows/official-seadrop-1155-mainnet-p1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/seadrop-p1-lab-20260911

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Select Ethereum RPC and verify factory binding
        id: state
        shell: bash
        run: |
          set -euo pipefail
          RPC=""
          for candidate in \
            https://ethereum-rpc.publicnode.com \
            https://eth.llamarpc.com \
            https://1rpc.io/eth \
            https://eth.drpc.org; do
            id=$(timeout 20s cast chain-id --rpc-url "$candidate" 2>/dev/null || true)
            linked=$(timeout 20s cast call 0x00b19A5200A100e5fc4c9800772f4d002f218400 'seaport()(address)' --rpc-url "$candidate" 2>/dev/null || true)
            if [[ "$id" == 1 && "$linked" == "0x0000000000000068F116a894984e2DB1123eB395" ]]; then
              RPC="$candidate"
              break
            fi
          done
          [[ -n "$RPC" ]] || { echo 'factory is unavailable or not bound to Seaport 1.6 on Ethereum' >&2; exit 1; }
          BLOCK=$(cast block-number --rpc-url "$RPC")
          echo "OPTIMISM_RPC_URL=$RPC" >> "$GITHUB_ENV"
          echo "OPTIMISM_FORK_BLOCK=$BLOCK" >> "$GITHUB_ENV"
          echo "rpc=$RPC" >> "$GITHUB_OUTPUT"
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts-mainnet
          printf '%s\n' "$RPC" > artifacts-mainnet/rpc.txt
          printf '%s\n' "$BLOCK" > artifacts-mainnet/fork-block.txt

      - name: Clone pinned Seaport and adapt test to Ethereum
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/ProjectOpenSea/seaport-1.6.git seaport-mainnet
          git -C seaport-mainnet checkout 4240dc6b30fa73f4b6b437fb588ebe583e796e3a
          git -C seaport-mainnet submodule update --init --recursive
          rm -rf seaport-mainnet/test
          mkdir -p seaport-mainnet/test/foundry
          cp research/OfficialSeaDrop1155PricedP1.t.sol seaport-mainnet/test/foundry/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('seaport-mainnet/test/foundry/OfficialSeaDrop1155PricedP1.t.sol')
          s = p.read_text()
          s = s.replace('0x4200000000000000000000000000000000000006', '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2')
          s = s.replace('assertEq(block.chainid, 10, "wrong chain");', 'assertEq(block.chainid, 1, "wrong chain");')
          s = s.replace(') internal view returns (bytes memory signature) {', ') internal returns (bytes memory signature) {')
          old = '        ConsiderationItem[] memory consideration = new ConsiderationItem[](0);\n        order = AdvancedOrder({'
          new = '''        ConsiderationItem[] memory consideration = new ConsiderationItem[](1);
        consideration[0] = ConsiderationItem({
            itemType: ItemType.ERC20,
            token: OPTIMISM_WETH,
            identifierOrCriteria: 0,
            startAmount: PRICE * quantity,
            endAmount: PRICE * quantity,
            recipient: payable(collectionOwner)
        });
        order = AdvancedOrder({'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one contract-order consideration block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cp seaport-mainnet/test/foundry/OfficialSeaDrop1155PricedP1.t.sol artifacts-mainnet/executed-test.sol
          git -C seaport-mainnet rev-parse HEAD > artifacts-mainnet/seaport-commit.txt

      - name: Execute independent proof
        id: tests
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd seaport-mainnet
          forge test --match-contract OfficialSeaDrop1155PricedP1Test --via-ir -vvvv 2>&1 | tee ../artifacts-mainnet/forge.log
          RC=${PIPESTATUS[0]}
          cd ..
          printf '%s\n' "$RC" > artifacts-mainnet/forge-exit.txt
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record exact identities and channel state
        shell: bash
        run: |
          set -euo pipefail
          : > artifacts-mainnet/runtime-identities.txt
          for item in \
            seaport:0x0000000000000068F116a894984e2DB1123eB395 \
            controller:0x00000000F9490004C11Cef243f5400493c00Ad63 \
            conduit:0x1E0049783F008A0085193E00003D00cd54003c71 \
            factory:0x00b19A5200A100e5fc4c9800772f4d002f218400 \
            weth:0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2; do
            name=${item%%:*}; address=${item#*:}
            code=$(cast code "$address" --rpc-url "$OPTIMISM_RPC_URL")
            printf '%s\n' "$code" > "artifacts-mainnet/$name-runtime.hex"
            printf '%s %s %s\n' "$name" "$(((${#code}-2)/2))" "$(cast keccak "$code")" >> artifacts-mainnet/runtime-identities.txt
          done
          cast call 0x00000000F9490004C11Cef243f5400493c00Ad63 \
            'getChannelStatus(address,address)(bool)' \
            0x1E0049783F008A0085193E00003D00cd54003c71 \
            0x0000000000000068F116a894984e2DB1123eB395 \
            --rpc-url "$OPTIMISM_RPC_URL" > artifacts-mainnet/conduit-channel.txt

      - name: Build and publish independent verdict
        id: verdict
        shell: bash
        run: |
          set -euo pipefail
          RC=$(cat artifacts-mainnet/forge-exit.txt)
          PASS_COUNT=$(grep -c '\[PASS\]' artifacts-mainnet/forge.log || true)
          FAIL_COUNT=$(grep -c '\[FAIL' artifacts-mainnet/forge.log || true)
          CHANNEL=$(tr -d '\r\n' < artifacts-mainnet/conduit-channel.txt)
          RESULT=NOT_PROVEN
          if [[ "$RC" == 0 && "$PASS_COUNT" -eq 5 && "$FAIL_COUNT" -eq 0 && "$CHANNEL" == true ]]; then
            RESULT=ETHEREUM_OFFICIAL_SEADROP_ERC1155_PAID_FAILURE_PROVEN
          fi
          jq -n \
            --arg result "$RESULT" \
            --arg rpc '${{ steps.state.outputs.rpc }}' \
            --argjson block '${{ steps.state.outputs.block }}' \
            --argjson forgeExit "$RC" \
            --argjson passes "$PASS_COUNT" \
            --argjson failures "$FAIL_COUNT" \
            --arg channel "$CHANNEL" \
            '{result:$result,rpc:$rpc,forkBlock:$block,forgeExit:$forgeExit,passes:$passes,failures:$failures,conduitChannelOpen:($channel=="true"),chainId:1,signedZoneUsed:false,residualPaymentUsed:false,freeMintUsed:false}' \
            > artifacts-mainnet/verdict.json
          {
            cat artifacts-mainnet/verdict.json
            echo
            grep -E '\[PASS\]|\[FAIL|Compiler run|Error:|AuthorizationDelta|revert' artifacts-mainnet/forge.log | tail -n 200 || true
          } > artifacts-mainnet/summary.txt
          cat artifacts-mainnet/summary.txt
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          sha256sum artifacts-mainnet/* > artifacts-mainnet/SHA256SUMS.txt
          mkdir -p research/results
          cp artifacts-mainnet/verdict.json research/results/official-seadrop-1155-mainnet-verdict.json
          cp artifacts-mainnet/summary.txt research/results/official-seadrop-1155-mainnet-summary.txt
          cp artifacts-mainnet/runtime-identities.txt research/results/official-seadrop-1155-mainnet-runtime-identities.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research/results/
          git commit -m 'Record independent Ethereum SeaDrop verdict' || true
          git pull --rebase origin research/seadrop-p1-lab-20260911 || true
          git push origin HEAD:research/seadrop-p1-lab-20260911

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-seadrop-1155-mainnet-p1
          path: |
            artifacts-mainnet/
            research/OfficialSeaDrop1155PricedP1.t.sol
          if-no-files-found: error

      - name: Enforce proof verdict
        if: always()
        run: test '${{ steps.verdict.outputs.result }}' = ETHEREUM_OFFICIAL_SEADROP_ERC1155_PAID_FAILURE_PROVEN
