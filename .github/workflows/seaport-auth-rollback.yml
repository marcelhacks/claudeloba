name: Seaport deployed-source authorization regression

on:
  push:
    branches:
      - research/seaport-auth-rollback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SEAPORT_COMMIT: b8d4f10639bd5ef76b93758c0fed2ac50e4c3deb
      CORE_COMMIT: 1a0a4758cced1d3de962817cd37c2387fb290eea
      TYPES_COMMIT: b72493221ee1d2f2fb30ed94a3cc535a9028d09f
      SEAPORT_ADDRESS: 0x0000000000000068F116a894984e2DB1123eB395
      MAINNET_RPC: https://ethereum-rpc.publicnode.com

    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Install Forge and Cast
        shell: bash
        run: |
          set -euxo pipefail
          npm install --global @foundry-rs/forge@1.7.1 @foundry-rs/cast@1.7.1
          forge --version
          cast --version

      - name: Checkout exact deployed Seaport 1.6 release tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/ProjectOpenSea/seaport.git upstream
          cd upstream
          git checkout "$SEAPORT_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$SEAPORT_COMMIT"
          test "$(git -C lib/seaport-core rev-parse HEAD)" = "$CORE_COMMIT"
          test "$(git -C lib/seaport-types rev-parse HEAD)" = "$TYPES_COMMIT"

      - name: Install regression test
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p upstream/test/foundry/research
          cp research/AuthorizeStatusRollback.t.sol \
            upstream/test/foundry/research/AuthorizeStatusRollback.t.sol

      - name: Build exact optimized and reference artifacts
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf optimized-cache optimized-out reference-cache reference-out
          FOUNDRY_PROFILE=optimized forge build 2>&1 | tee ../current-build.log
          FOUNDRY_PROFILE=reference forge build 2>&1 | tee ../reference-build.log
          test -f optimized-out/Seaport.sol/Seaport.json
          test -f optimized-out/Consideration.sol/Consideration.json
          test -f optimized-out/ConduitController.sol/ConduitController.json
          test -f reference-out/ReferenceConsideration.sol/ReferenceConsideration.json
          test -f reference-out/ReferenceConduitController.sol/ReferenceConduitController.json

      - name: Match compiled runtime to deployed mainnet runtime
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          cast code "$SEAPORT_ADDRESS" --rpc-url "$MAINNET_RPC" > ../mainnet-code.hex
          python3 - <<'PY' 2>&1 | tee ../bytecode-match.log
          import hashlib
          import json
          import os
          from pathlib import Path

          artifact_path = Path("optimized-out/Seaport.sol/Seaport.json")
          artifact = json.loads(artifact_path.read_text())

          deployed = artifact["deployedBytecode"]
          if isinstance(deployed, dict):
              compiled_hex = deployed.get("object", "")
              refs = deployed.get("immutableReferences", {})
          else:
              compiled_hex = deployed
              refs = artifact.get("immutableReferences", {})

          compiled_hex = compiled_hex.removeprefix("0x")
          live_hex = Path("../mainnet-code.hex").read_text().strip().removeprefix("0x")
          compiled = bytearray.fromhex(compiled_hex)
          live = bytearray.fromhex(live_hex)

          print(f"compiled_length={len(compiled)}")
          print(f"live_length={len(live)}")
          if len(compiled) != len(live):
              raise SystemExit("runtime lengths differ")

          total_refs = 0
          for entries in refs.values():
              for entry in entries:
                  start = int(entry["start"])
                  length = int(entry["length"])
                  total_refs += 1
                  compiled[start:start + length] = b"\x00" * length
                  live[start:start + length] = b"\x00" * length

          print(f"masked_immutable_references={total_refs}")
          compiled_hash = hashlib.sha256(compiled).hexdigest()
          live_hash = hashlib.sha256(live).hexdigest()
          print(f"compiled_masked_sha256={compiled_hash}")
          print(f"live_masked_sha256={live_hash}")
          if compiled != live:
              for i, (a, b) in enumerate(zip(compiled, live)):
                  if a != b:
                      print(f"first_difference_offset={i} compiled={a:02x} live={b:02x}")
                      break
              raise SystemExit("masked deployed runtime does not match")
          print("DEPLOYED_BYTECODE_MATCH=PASS")
          PY
          grep -q 'DEPLOYED_BYTECODE_MATCH=PASS' ../bytecode-match.log

      - name: Prove current implementation rolls back stateful authorizeOrder
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          forge test \
            --match-path test/foundry/research/AuthorizeStatusRollback.t.sol \
            --match-test testCurrentPatchRevertsAndRollsBack \
            -vvvv 2>&1 | tee ../current.log
          grep -q '\[PASS\] testCurrentPatchRevertsAndRollsBack' ../current.log
          ! grep -qE '\[FAIL:|Suite result: FAILED|Encountered a total of [1-9]' ../current.log

      - name: Recreate the historical vulnerable behavior
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/seaport-core/src/lib/OrderCombiner.sol")
          source = path.read_text()
          fixed = '''        OrderType orderType = orderParameters.orderType;
                  address zone = orderParameters.zone;
                  assembly {
                      revertOnFailedUpdate := or(
                          revertOnInvalid,
                          and(gt(orderType, 1), iszero(eq(caller(), zone)))
                      )
                  }'''
          vulnerable = '''        orderParameters;
                  revertOnFailedUpdate = revertOnInvalid;'''
          if source.count(fixed) != 1:
              raise SystemExit(f"expected one target block, found {source.count(fixed)}")
          path.write_text(source.replace(fixed, vulnerable, 1))
          PY
          git diff --check
          git diff -- lib/seaport-core/src/lib/OrderCombiner.sol

      - name: Build historical vulnerable mutation
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf optimized-cache optimized-out
          FOUNDRY_PROFILE=optimized forge build 2>&1 | tee ../mutated-build.log
          test -f optimized-out/Consideration.sol/Consideration.json

      - name: Prove mutation leaves unmatched stateful authorization
        working-directory: upstream
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf cache out test-cache
          forge test \
            --match-path test/foundry/research/AuthorizeStatusRollback.t.sol \
            --match-test testVulnerableMutationLeavesUnpairedAuthorization \
            -vvvv 2>&1 | tee ../vulnerable.log
          grep -q '\[PASS\] testVulnerableMutationLeavesUnpairedAuthorization' ../vulnerable.log
          ! grep -qE '\[FAIL:|Suite result: FAILED|Encountered a total of [1-9]' ../vulnerable.log

      - name: Upload proof traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seaport-deployed-auth-rollback-proof
          path: |
            current-build.log
            reference-build.log
            mainnet-code.hex
            bytecode-match.log
            current.log
            mutated-build.log
            vulnerable.log
          if-no-files-found: warn
