name: Official SeaDrop Seaport 1.6 fork proof v2

on:
  push:
    branches:
      - research/polygon-contract-state-scan-20260911
    paths:
      - ".github/workflows/seadrop-official-factory-fork-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polygon-contract-state-scan-20260911

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Apply exact-status oracle correction
        run: |
          cp research/seadrop-gold-current/OfficialFactoryFork.t.sol \
             research/seadrop-gold-current/OfficialFactoryForkV2.t.sol
          python3 - <<'PY'
from pathlib import Path
p = Path('research/seadrop-gold-current/OfficialFactoryForkV2.t.sol')
s = p.read_text()
s = s.replace(
    'assertEq(filled, units);\n        assertEq(size, units);',
    'assertGt(filled, 0);\n        assertEq(filled, size);'
)
p.write_text(s)

r = Path('research/seadrop-gold-current/run-v2.sh')
text = Path('research/seadrop-gold-current/run.sh').read_text()
text = text.replace('OfficialFactoryFork.t.sol', 'OfficialFactoryForkV2.t.sol')
text = text.replace('results/latest', 'results/latest-v2')
r.write_text(text)
PY
          chmod +x research/seadrop-gold-current/run-v2.sh

      - name: Run current official factory fork matrix
        id: lab
        continue-on-error: true
        run: research/seadrop-gold-current/run-v2.sh

      - name: Commit machine result
        if: always()
        run: |
          git config user.name "seadrop-lab-bot"
          git config user.email "seadrop-lab-bot@users.noreply.github.com"
          git add research/seadrop-gold-current/results/latest-v2 || true
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected official SeaDrop fork result [skip ci]"
            git push origin HEAD:research/polygon-contract-state-scan-20260911
          fi

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-seadrop-seaport-1-6-proof-v2
          path: |
            research/seadrop-gold-current/results/latest-v2/
            research/seadrop-gold-current/OfficialFactoryForkV2.t.sol
          if-no-files-found: warn

      - name: Enforce proof gate
        if: always()
        run: |
          test "$(cat research/seadrop-gold-current/results/latest-v2/RESULT.txt)" = "OFFICIAL_SEADROP_SEAPORT_1_6_OUTSIDER_THEFT_PROVEN"
